<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cond. viver bem</title>
    <link rel="stylesheet" href="../front/style.css">
</head>
<body>
    <main class="login-page">
        <form class="login-card" action="">
            <div class="brand-mark" aria-hidden="true">VB</div>
            <p class="eyebrow">CONDOMÍNIO VIVER BEM</p>
            <h1>Bem-vindo de volta</h1>
            <p class="subtitle">Entre com seus dados para acessar sua conta.</p>

            <div class="form-fields">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>

                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            </div>

            <button type="submit">Entrar na minha conta</button>
            <p class="card-footer">Acesso exclusivo para sindico</p>
        </form>
    </main>
    <script src="../front/script.js"></script>
</body>
</html>
